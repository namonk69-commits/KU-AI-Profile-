<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="100%" height="100%">
  <defs>
    <filter id="pencil-texture-nori" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <g filter="url(#pencil-texture-nori)">
    <!-- Seaweed Sheet -->
    <path d="M 25 20 L 115 15 L 125 155 L 15 160 Z" 
          fill="#1E2A20" stroke="#121D14" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Highlights & texture -->
    <path d="M 35 30 L 105 25 L 112 145 L 25 150 Z" 
          fill="#2C3D2F" opacity="0.6"/>

    <!-- Green speckles & pencil strokes -->
    <path d="M 40 45 L 55 52 M 80 40 L 95 48 M 35 80 L 50 85 M 70 95 L 85 102 M 45 125 L 60 130 M 85 135 L 100 140" 
          stroke="#47684C" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
