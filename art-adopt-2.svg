<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="sketch-adopt2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="bg-adopt2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#E09F3E" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-adopt2)" rx="12" filter="url(#sketch-adopt2)"/>
  <rect x="15" y="15" width="370" height="270" fill="#FFFDF8" rx="8" stroke="#DDB892" stroke-width="2" stroke-dasharray="6,4"/>
  
  <g filter="url(#sketch-adopt2)">
    <!-- Status Tag: OPEN -->
    <rect x="30" y="30" width="80" height="26" rx="13" fill="#2A9D8F"/>
    <text x="44" y="48" font-family="'Mali', sans-serif" font-size="12" font-weight="bold" fill="#FFF">✦ OPEN</text>

    <!-- Character Art: Spicy Dragon Girl -->
    <g transform="translate(100, 30)">
      <!-- Dragon Horns -->
      <path d="M 65 50 Q 40 20 50 10 Q 70 30 75 45" fill="#E76F51" stroke="#8A421D" stroke-width="2"/>
      <path d="M 135 50 Q 160 20 150 10 Q 130 30 125 45" fill="#E76F51" stroke="#8A421D" stroke-width="2"/>

      <!-- Dragon Tail with chili flame -->
      <path d="M 150 170 C 200 180, 220 140, 210 110" fill="none" stroke="#E76F51" stroke-width="12" stroke-linecap="round"/>
      <path d="M 210 110 Q 225 90 215 80 Q 200 95 210 110" fill="#F4A261" stroke="#9C6644" stroke-width="2"/>

      <!-- Head & Face -->
      <circle cx="100" cy="85" r="38" fill="#FFF2E8" stroke="#8A421D" stroke-width="2.5"/>
      <!-- Fiery Orange Hair -->
      <path d="M 68 85 C 68 50, 132 50, 132 85 C 132 90, 115 70, 100 70 C 85 70, 68 90, 68 85 Z" fill="#F4A261" stroke="#8A421D" stroke-width="2"/>
      
      <!-- Dragon eyes with slit pupils -->
      <ellipse cx="88" cy="85" rx="5" ry="7" fill="#E76F51"/>
      <line x1="88" y1="80" x2="88" y2="90" stroke="#FFF" stroke-width="2"/>
      <ellipse cx="112" cy="85" rx="5" ry="7" fill="#E76F51"/>
      <line x1="112" y1="80" x2="112" y2="90" stroke="#FFF" stroke-width="2"/>
      
      <ellipse cx="78" cy="94" rx="6" ry="4" fill="#FF8FAB"/>
      <ellipse cx="122" cy="94" rx="6" ry="4" fill="#FF8FAB"/>
      <!-- Fang smile -->
      <path d="M 96 95 Q 100 100 104 95" fill="none" stroke="#8A421D" stroke-width="2"/>
      <polygon points="98,95 100,99 102,95" fill="#FFF"/>

      <!-- Spicy Outfit -->
      <path d="M 75 120 L 125 120 L 135 195 L 65 195 Z" fill="#9B2226" stroke="#4A0D0E" stroke-width="2.5"/>
      <circle cx="100" cy="145" r="8" fill="#FFD166"/>
    </g>

    <!-- Side details / Color palette swatches -->
    <text x="270" y="55" font-family="'Mali', sans-serif" font-size="13" font-weight="bold" fill="#8A421D">Spicy Tantan Dragon</text>
    <text x="270" y="75" font-family="'Mali', 'Sarabun', sans-serif" font-size="11" fill="#7F5539">Type: Dragon / Spicy</text>
    <text x="270" y="93" font-family="'Mali', 'Sarabun', sans-serif" font-size="11" fill="#7F5539">SB: 40$ / AB: 95$</text>
    <text x="270" y="112" font-family="'Mali', sans-serif" font-size="11" font-weight="bold" fill="#E76F51">● Status: Available</text>

    <!-- Palette dots -->
    <circle cx="280" cy="140" r="8" fill="#9B2226" stroke="#4A0D0E" stroke-width="1.5"/>
    <circle cx="305" cy="140" r="8" fill="#E76F51" stroke="#4A0D0E" stroke-width="1.5"/>
    <circle cx="330" cy="140" r="8" fill="#F4A261" stroke="#4A0D0E" stroke-width="1.5"/>
    <circle cx="355" cy="140" r="8" fill="#FFD166" stroke="#4A0D0E" stroke-width="1.5"/>
  </g>
  
  <text x="30" y="270" font-family="'Mali', 'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#6F4E37">🐉 Adoptable #02: "Spicy Tantanmen Dragon" (Available)</text>
</svg>
