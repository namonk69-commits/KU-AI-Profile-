    <path d="M 80 44 C 102 44, 120 60, 120 80 C 120 100, 100 118, 78 116 C 58 114, 46 96, 50 78 C 54 62, 70 54, 86 58 C 100 62, 106 76, 102 88 C 98 98, 86 104, 76 100 C 68 96, 68 86, 72 80 C 76 74, 84 76, 84 82" 
