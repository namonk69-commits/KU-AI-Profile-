    <path d="M 80 44 C 102 44, 120 60, 120 80 C 120 100, 100 118, 78 116 C 58 114, 46 96, 50 78 C 54 62, 70 54, 86 58 C 100 62, 106 76, 102 88 C 98 98, 86 104, 76 100 C 68 96, 68 86, 72 80 C 76 74, 84 76, 84 82" 
          fill="none" stroke="#D83F67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Pencil sketch marks -->
    <path d="M 45 60 L 52 70 M 115 65 L 122 75 M 105 110 L 115 120 M 55 115 L 65 125" 
          stroke="#C58572" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
