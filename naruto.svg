<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="pencil-texture-naruto" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <g filter="url(#pencil-texture-naruto)">
    <!-- Shadow / 3D edge -->
    <path d="M 32 80 C 28 42, 60 22, 92 20 C 128 18, 148 48, 146 86 C 144 122, 118 146, 80 148 C 45 150, 35 118, 32 80 Z" 
          fill="#E8DDD2" stroke="#B8A799" stroke-width="2"/>

