    <path d="M 80 24 C 92 22, 102 26, 112 28 C 122 32, 134 38, 138 48 C 144 58, 142 70, 144 80 C 146 92, 142 104, 136 114 C 130 124, 120 132, 108 138 C 96 142, 84 144, 72 142 C 60 140, 48 134, 40 124 C 32 114, 30 102, 28 90 C 26 78, 30 66, 36 56 C 42 46, 52 38, 64 32 C 70 28, 75 25, 80 24 Z" 
          fill="#FAF6F0" stroke="#8C5C42" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Outer light pink tone -->
    <path d="M 80 32 C 105 30, 132 45, 134 78 C 136 112, 112 134, 80 134 C 48 134, 36 108, 38 78 C 40 48, 60 34, 80 32 Z" 
          fill="#FFF0F3" opacity="0.6"/>

