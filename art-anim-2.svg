<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="sketch-anim2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#3A3845" rx="12"/>
  <rect x="15" y="15" width="370" height="270" fill="#25242C" rx="8" stroke="#C69B7B" stroke-width="2"/>
  
  <g filter="url(#sketch-anim2)">
    <!-- 3 Keyframes of Chashu Jumping into soup -->
    <!-- Frame 1 -->
    <g transform="translate(60, 110) scale(0.45)">
      <ellipse cx="60" cy="60" rx="55" ry="45" fill="#C59675" stroke="#6B3F23" stroke-width="6"/>
      <path d="M 30 60 Q 60 40 90 60" fill="none" stroke="#FDF3E7" stroke-width="8"/>
      <text x="35" y="140" font-family="'Mali', sans-serif" font-size="28" fill="#F4A261">F-01</text>
    </g>
    <!-- Motion Arrow -->
    <path d="M 125 125 Q 155 90 180 100" fill="none" stroke="#F7B267" stroke-width="3" stroke-dasharray="4,3"/>
    
    <!-- Frame 2 (Peak Jump) -->
    <g transform="translate(170, 75) scale(0.5) rotate(20, 60, 60)">
      <ellipse cx="60" cy="60" rx="55" ry="45" fill="#C59675" stroke="#6B3F23" stroke-width="6"/>
      <path d="M 30 60 Q 60 40 90 60" fill="none" stroke="#FDF3E7" stroke-width="8"/>
      <!-- Sparkles -->
      <polygon points="120,30 125,40 135,45 125,50 120,60 115,50 105,45 115,40" fill="#FFE66D"/>
    </g>

    <!-- Motion Arrow -->
    <path d="M 235 115 Q 265 140 290 155" fill="none" stroke="#F7B267" stroke-width="3" stroke-dasharray="4,3"/>

    <!-- Frame 3 (Splashdown) -->
    <g transform="translate(280, 120) scale(0.45)">
      <ellipse cx="60" cy="60" rx="55" ry="45" fill="#C59675" stroke="#6B3F23" stroke-width="6"/>
      <path d="M 30 60 Q 60 40 90 60" fill="none" stroke="#FDF3E7" stroke-width="8"/>
      <!-- Splash droplets -->
      <circle cx="20" cy="20" r="8" fill="#F4D06F"/>
      <circle cx="100" cy="15" r="7" fill="#F4D06F"/>
      <circle cx="115" cy="50" r="6" fill="#F4D06F"/>
      <text x="35" y="140" font-family="'Mali', sans-serif" font-size="28" fill="#F4A261">F-12</text>
    </g>
  </g>

  <!-- Play Overlay -->
  <circle cx="200" cy="195" r="28" fill="#E76F51" opacity="0.9"/>
  <polygon points="194,183 214,195 194,207" fill="#FFF"/>

  <text x="30" y="265" font-family="'Mali', 'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#EDF2F4">✨ 2D Motion: "Chashu Pork Splash Animation"</text>
  <text x="330" y="265" font-family="'Mali', sans-serif" font-size="12" fill="#8D99AE">60 FPS</text>
</svg>
